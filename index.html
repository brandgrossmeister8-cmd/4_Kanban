<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан Доска</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Канбан Доска</h1>
        </header>

        <div class="board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <h2>К выполнению</h2>
                    <span class="count">0</span>
                </div>
                <button class="add-task-btn" onclick="addTask('todo')">+ Добавить задачу</button>
                <div class="tasks" id="todo-tasks"></div>
            </div>

            <div class="column" data-status="in-progress">
                <div class="column-header">
                    <h2>В работе</h2>
                    <span class="count">0</span>
                </div>
                <button class="add-task-btn" onclick="addTask('in-progress')">+ Добавить задачу</button>
                <div class="tasks" id="in-progress-tasks"></div>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <h2>Готово</h2>
                    <span class="count">0</span>
                </div>
                <button class="add-task-btn" onclick="addTask('done')">+ Добавить задачу</button>
                <div class="tasks" id="done-tasks"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Новая задача</h2>
            <input type="text" id="task-title" placeholder="Название задачи" autocomplete="off">
            <textarea id="task-description" placeholder="Описание задачи (необязательно)"></textarea>

            <div class="form-group">
                <label for="task-category">Категория</label>
                <select id="task-category">
                    <option value="">Выберите категорию</option>
                    <option value="bug">Ошибка</option>
                    <option value="feature">Новая функция</option>
                    <option value="improvement">Улучшение</option>
                    <option value="documentation">Документация</option>
                    <option value="testing">Тестирование</option>
                    <option value="other">Другое</option>
                </select>
            </div>

            <div class="form-group">
                <label for="task-creator">Постановщик</label>
                <input type="text" id="task-creator" placeholder="ФИО постановщика">
            </div>

            <div class="form-group">
                <label for="task-assignee">Исполнитель</label>
                <input type="text" id="task-assignee" placeholder="ФИО исполнителя">
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="task-has-deadline">
                    <label for="task-has-deadline">Установить срок выполнения</label>
                </div>
            </div>

            <div class="form-group" id="deadline-group" style="display: none;">
                <label for="task-deadline">Дата и время</label>
                <input type="datetime-local" id="task-deadline">
            </div>

            <div class="modal-buttons">
                <button onclick="saveTask()" class="btn-primary">Сохранить</button>
                <button onclick="closeModal()" class="btn-secondary">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
