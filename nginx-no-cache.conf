# =====================================================
# Конфигурация Nginx для отключения кеширования CSS/JS
# =====================================================
#
# Использование:
# 1. Добавьте эти строки в ваш server {} блок nginx конфигурации
# 2. Перезагрузите nginx: sudo systemctl reload nginx
#

# Отключить кеширование CSS и JS файлов
location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
}

